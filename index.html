<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ghép Thơ - Thu Nhiên</title>
<!-- CẤU HÌNH PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghép Thơ">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,500;1,500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
body { font-family: 'Roboto', sans-serif; background-color: #f3f4f6; overscroll-behavior-y: contain; user-select: none; -webkit-user-select: none; }
#canvas-container { position: relative; width: 100%; background: #e5e7eb; border-radius: 0.5rem; display: flex; justify-content: center; align-items: center; min-height: 250px; }
canvas { max-width: 100%; max-height: 60vh; object-fit: contain; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
input[type="color"] { -webkit-appearance: none; border: none; padding: 0; width: 2.5rem; height: 2.5rem; border-radius: 50%; overflow: hidden; }
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: 2px solid #e5e7eb; border-radius: 50%; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -6px; }
input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #e5e7eb; border-radius: 4px; }
#pasteArea:empty:before { content: attr(placeholder); color: #9ca3af; pointer-events: none; }
#pasteArea img { max-width: 100%; max-height: 100px; object-fit: contain; border-radius: 4px; opacity: 0.5; }
textarea, input { user-select: text; -webkit-user-select: text; }
@media (max-width: 768px) {
.mobile-fixed-bottom { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; border-radius: 0 !important; margin: 0 !important; box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1); }
body { padding-bottom: 130px; }
}
#loading-overlay { display: none; position: absolute; inset: 0; background: rgba(255,255,255,0.8); z-index: 20; flex-direction: column; justify-content: center; align-items: center; border-radius: 0.5rem; }
.spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="p-2 md:p-8 relative min-h-screen flex flex-col">
<div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg p-4 md:p-6 mb-4 flex-grow w-full">
<h1 class="text-xl md:text-3xl font-bold text-gray-800 mb-4 text-center">Ghép Thơ Lên Ảnh</h1>
<div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
<div class="lg:col-span-8 flex flex-col order-1 lg:order-2">
<label class="block text-sm font-bold text-gray-700 mb-2">Ảnh của bạn <span class="text-blue-500 font-normal">(Chạm vào chữ để di chuyển)</span></label>
<div id="canvas-container" class="border border-gray-300 shadow-inner relative group">
<div id="placeholder-text" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 pointer-events-none p-4 text-center">
<svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-3 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
</svg>
<p class="text-base font-medium">Chưa có ảnh</p>
<p class="text-xs mt-1">Sử dụng công cụ bên dưới để thêm ảnh</p>
</div>
<div id="loading-overlay">
<div class="spinner mb-3"></div>
<p class="text-sm font-bold text-blue-600">Đang xử lý ảnh...</p>
</div>
<canvas id="imageCanvas"></canvas>
</div>
<p class="text-xs text-gray-500 mt-2 text-center">Mẹo: Vuốt bên ngoài vùng chữ để cuộn màn hình.</p>
</div>
<div class="space-y-5 lg:col-span-4 bg-gray-50 p-4 rounded-lg border border-gray-200 shadow-sm order-2 lg:order-1">
<div>
<label class="block text-sm font-bold text-blue-600 mb-2">1. Thêm ảnh</label>
<div class="space-y-3">
<div class="bg-white border-2 border-dashed border-gray-300 rounded-lg p-3 text-center">
<p class="text-xs text-gray-600 mb-2 font-medium">Nhấn giữ vào ô dưới và chọn "Dán"</p>
<div id="pasteArea" contenteditable="true" placeholder="[ Nhấn giữ vào đây để dán ảnh ]" class="w-full min-h-[50px] bg-gray-50 border border-gray-200 rounded flex flex-col items-center justify-center text-sm text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white transition p-2 break-all overflow-hidden"></div>
</div>
<div>
<label class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold py-3 px-4 rounded-lg border border-blue-200 flex items-center justify-center gap-2 cursor-pointer transition">
<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
</svg>
<span>Chọn ảnh từ điện thoại</span>
<input type="file" id="imageLoader" accept="image/*" class="hidden">
</label>
</div>
</div>
</div>
<div>
<label class="block text-sm font-bold text-gray-700 mb-2">2. Sửa chữ</label>
<textarea id="poemText" rows="6" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm resize-y leading-relaxed">Người đến rồi lại vội đi
Để ta vương vấn sầu bi nửa đời
Nàng trao hạnh phúc nửa vời
Bước đi chẳng nói nửa lời cách xa
Chữ tình như thể đóa hoa
Cuối cùng cũng bị người ta hái rồi
Tác giả: Hàn Tấn
Đạo hiệu: Song Tu Tiên Tôn</textarea>
</div>
<div class="space-y-4 bg-white p-4 rounded-lg border border-gray-100 shadow-inner">
<label class="block text-sm font-bold text-gray-700 border-b pb-2">3. Tùy chỉnh</label>
<div class="space-y-4">
<div>
<span class="text-xs text-gray-500 mb-1 block">Kiểu chữ</span>
<select id="fontFamily" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none font-medium bg-white">
<option value="Dancing Script" selected>Thư pháp lãng mạn</option>
<option value="Playfair Display">Cổ điển trang trọng</option>
<option value="Roboto">Hiện đại, rõ ràng</option>
</select>
</div>
<div>
<div class="flex justify-between mb-2">
<span class="text-xs text-gray-500">Cỡ chữ (Auto đồng bộ)</span>
<span id="fontSizeVal" class="text-xs font-bold text-blue-600">60px</span>
</div>
<input type="range" id="fontSize" min="15" max="400" value="60" class="w-full appearance-none bg-transparent">
</div>
</div>
<div class="grid grid-cols-2 gap-4 pt-2">
<div class="flex flex-col items-center justify-center p-2 border rounded-lg bg-gray-50">
<span class="text-xs text-gray-600 font-medium mb-1">Màu chữ</span>
<input type="color" id="textColor" value="#ffffff" class="cursor-pointer">
</div>
<div class="flex flex-col items-center justify-center p-2 border rounded-lg bg-gray-50">
<span class="text-xs text-gray-600 font-medium mb-1">Màu viền</span>
<input type="color" id="shadowColor" value="#000000" class="cursor-pointer">
</div>
<div class="col-span-2">
<button id="autoColorBtn" class="w-full bg-gray-100 active:bg-gray-200 text-gray-700 text-xs font-semibold py-2.5 rounded-lg border border-gray-300 flex items-center justify-center gap-2 transition">
<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
</svg>
Đọc màu ảnh & Tự động phối màu
</button>
</div>
</div>
<div>
<div class="flex justify-between mb-2 mt-2">
<span class="text-xs text-gray-500">Độ dày viền (Auto đồng bộ)</span>
<span id="shadowBlurVal" class="text-xs font-bold text-blue-600">12px</span>
</div>
<input type="range" id="shadowBlur" min="0" max="100" value="12" class="w-full appearance-none bg-transparent">
</div>
</div>
<button id="downloadBtn" class="w-full bg-blue-600 active:bg-blue-800 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-200 flex justify-center items-center gap-2 text-base mobile-fixed-bottom">
<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
</svg>
Lưu Ảnh Về Máy
</button>
</div>
</div>
</div>
<footer class="text-center pb-8 mt-auto z-10 relative">
<p class="text-gray-600 font-medium font-serif italic text-base">
✿ Tác giả: Thu Nhiên ✿
</p>
</footer>
<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
navigator.serviceWorker.register('./sw.js').catch(err => {
console.log('Lỗi đăng ký:', err);
});
});
}
const canvas = document.getElementById('imageCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const imageLoader = document.getElementById('imageLoader');
const pasteArea = document.getElementById('pasteArea');
const poemText = document.getElementById('poemText');
const fontSizeSlider = document.getElementById('fontSize');
const fontSizeVal = document.getElementById('fontSizeVal');
const fontFamilySelect = document.getElementById('fontFamily');
const textColorInput = document.getElementById('textColor');
const shadowColorInput = document.getElementById('shadowColor');
const shadowBlurSlider = document.getElementById('shadowBlur');
const shadowBlurVal = document.getElementById('shadowBlurVal');
const downloadBtn = document.getElementById('downloadBtn');
const placeholderText = document.getElementById('placeholder-text');
const autoColorBtn = document.getElementById('autoColorBtn');
const loadingOverlay = document.getElementById('loading-overlay');
let img = new Image();
let isImageLoaded = false;
let textX = 50; let textY = 50;
let isDragging = false; let dragOffsetX = 0; let dragOffsetY = 0;
// Hàm xử lý kích thước ảnh để iPhone không bị "quá tải"
function resizeImage(base64Str, maxWidth = 1600, maxHeight = 1600) {
return new Promise((resolve) => {
let tempImg = new Image();
tempImg.onload = () => {
let width = tempImg.width;
let height = tempImg.height;
if (width > maxWidth || height > maxHeight) {
const ratio = Math.min(maxWidth / width, maxHeight / height);
width = Math.round(width * ratio);
height = Math.round(height * ratio);
}
let tempCanvas = document.createElement('canvas');
tempCanvas.width = width; tempCanvas.height = height;
tempCanvas.getContext('2d').drawImage(tempImg, 0, 0, width, height);
resolve(tempCanvas.toDataURL('image/jpeg', 0.85));
};
tempImg.src = base64Str;
});
}
function applyAutoColor() {
if (!isImageLoaded) return;
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.drawImage(img, 0, 0);
try {
const width = canvas.width; const height = canvas.height;
const data = ctx.getImageData(0, 0, width, height).data;
let r = 0, g = 0, b = 0, count = 0;
for (let i = 0; i < data.length; i += 4 * 40) {
r += data[i]; g += data[i+1]; b += data[i+2]; count++;
}
if (count > 0) {
r = Math.floor(r / count); g = Math.floor(g / count); b = Math.floor(b / count);
const brightness = (r * 299 + g * 587 + b * 114) / 1000;
if (brightness < 128) {
textColorInput.value = '#ffffff'; shadowColorInput.value = '#000000';
} else {
textColorInput.value = '#1a1a1a'; shadowColorInput.value = '#ffffff';
}
}
} catch (e) {}
draw();
}
autoColorBtn.addEventListener('click', applyAutoColor);
// Hàm chính thức nạp ảnh lên Canvas
async function loadAndDrawImage(srcData) {
loadingOverlay.style.display = 'flex';
try {
const resizedData = await resizeImage(srcData);
img.onload = function() {
canvas.width = img.width; canvas.height = img.height;
isImageLoaded = true;
placeholderText.style.display = 'none';
loadingOverlay.style.display = 'none';
pasteArea.innerHTML = ''; // Làm sạch ô Paste
let minEdge = Math.min(img.width, img.height);
let autoFontSize = Math.floor(minEdge * 0.055);
autoFontSize = Math.max(20, Math.min(autoFontSize, 400));
fontSizeSlider.max = Math.max(200, Math.floor(minEdge * 0.15));
fontSizeSlider.value = autoFontSize;
fontSizeVal.innerText = autoFontSize + 'px';
let autoBlur = Math.floor(autoFontSize * 0.2);
shadowBlurSlider.value = autoBlur;
shadowBlurVal.innerText = autoBlur + 'px';
textX = img.width > img.height ? img.width * 0.5 : img.width * 0.1;
textY = img.height * 0.1;
window.scrollTo({ top: 0, behavior: 'smooth' });
applyAutoColor();
}
img.src = resizedData;
} catch (e) {
loadingOverlay.style.display = 'none';
alert("Lỗi xử lý ảnh, vui lòng thử lại!");
}
}
// Chọn file từ máy
imageLoader.addEventListener('change', function(e) {
if(e.target.files && e.target.files[0]) {
const reader = new FileReader();
reader.onload = function(event) { loadAndDrawImage(event.target.result); }
reader.readAsDataURL(e.target.files[0]);
e.target.value = '';
}
});
// XỬ LÝ SỰ KIỆN DÁN (Tối ưu tuyệt đối cho iPhone)
pasteArea.addEventListener('paste', function(e) {
const items = (e.clipboardData || window.clipboardData).items;
let fileFound = false;
// Cách 1: Thử lấy file theo cách chuẩn
if (items) {
for (let i = 0; i < items.length; i++) {
if (items[i].type.indexOf('image') !== -1) {
e.preventDefault();
const blob = items[i].getAsFile();
const reader = new FileReader();
reader.onload = function(event) { loadAndDrawImage(event.target.result); }
reader.readAsDataURL(blob);
fileFound = true;
break;
}
}
}
// Cách 2 (Cứu cánh cho iPhone): Nếu iPhone tự chèn ảnh HTML vào thẻ div, ta đợi 0.1s rồi bắt lấy nó
if (!fileFound) {
loadingOverlay.style.display = 'flex';
setTimeout(() => {
const imgElement = pasteArea.querySelector('img');
if (imgElement && imgElement.src) {
// Tìm thấy ảnh iPhone vừa chèn! Xử lý ngay!
loadAndDrawImage(imgElement.src);
} else {
// Thực sự không có ảnh nào
loadingOverlay.style.display = 'none';
pasteArea.innerText = "Không tìm thấy ảnh. Vui lòng copy lại ảnh!";
setTimeout(() => { pasteArea.innerHTML = ""; }, 2000);
}
}, 100); // Chờ 100ms để trình duyệt kịp vẽ HTML
}
});
// Hỗ trợ dán phím tắt trên PC
window.addEventListener('paste', function(e) {
if(e.target !== pasteArea && e.target !== poemText) {
const items = (e.clipboardData || e.originalEvent.clipboardData).items;
for (let i = 0; i < items.length; i++) {
if (items[i].type.indexOf('image') !== -1) {
e.preventDefault();
const blob = items[i].getAsFile();
const reader = new FileReader();
reader.onload = function(event) { loadAndDrawImage(event.target.result); }
reader.readAsDataURL(blob);
break;
}
}
}
});
poemText.addEventListener('input', draw); fontFamilySelect.addEventListener('change', draw);
fontSizeSlider.addEventListener('input', (e) => { fontSizeVal.innerText = e.target.value + 'px'; draw(); });
textColorInput.addEventListener('input', draw); shadowColorInput.addEventListener('input', draw);
shadowBlurSlider.addEventListener('input', (e) => { shadowBlurVal.innerText = e.target.value + 'px'; draw(); });
function isHittingText(mouseX, mouseY) {
const text = poemText.value; const fontSize = parseInt(fontSizeSlider.value);
const fontFamily = fontFamilySelect.value; ctx.font = ⁠${fontSize}px '${fontFamily}'⁠;
const lines = text.split('\n');
const lineHeight = fontFamily === 'Dancing Script' ? fontSize * 1.5 : fontSize * 1.3;
let maxWidth = 0;
lines.forEach(line => { const width = ctx.measureText(line).width; if (width > maxWidth) maxWidth = width; });
const totalHeight = lines.length * lineHeight;
const padding = 50;
return (mouseX >= textX - padding && mouseX <= textX + maxWidth + padding && mouseY >= textY - padding && mouseY <= textY + totalHeight + padding);
}
function draw() {
if (!isImageLoaded) return;
ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0);
const text = poemText.value; const fontSize = parseInt(fontSizeSlider.value);
const fontFamily = fontFamilySelect.value; const textColor = textColorInput.value;
const shadowColor = shadowColorInput.value; const shadowBlur = parseInt(shadowBlurSlider.value);
ctx.font = ⁠${fontSize}px '${fontFamily}'⁠; ctx.fillStyle = textColor;
ctx.textAlign = 'left'; ctx.textBaseline = 'top';
ctx.shadowColor = shadowColor; ctx.shadowBlur = shadowBlur;
ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
const lines = text.split('\n');
const lineHeight = fontFamily === 'Dancing Script' ? fontSize * 1.5 : fontSize * 1.3;
lines.forEach((line, index) => {
ctx.fillText(line, textX, textY + (index * lineHeight));
ctx.fillText(line, textX, textY + (index * lineHeight));
});
}
canvas.addEventListener('touchstart', (e) => {
if(!isImageLoaded) return;
const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
const touch = e.touches[0]; const mouseX = (touch.clientX - rect.left) * scaleX; const mouseY = (touch.clientY - rect.top) * scaleY;
if (isHittingText(mouseX, mouseY)) { isDragging = true; dragOffsetX = mouseX - textX; dragOffsetY = mouseY - textY; if(e.cancelable) e.preventDefault(); }
}, { passive: false });
window.addEventListener('touchend', () => { isDragging = false; });
canvas.addEventListener('touchmove', (e) => {
if (isDragging && isImageLoaded) {
const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
const touch = e.touches[0]; textX = (touch.clientX - rect.left) * scaleX - dragOffsetX; textY = (touch.clientY - rect.top) * scaleY - dragOffsetY; draw();
if(e.cancelable) e.preventDefault();
}
}, { passive: false });
canvas.addEventListener('mousedown', (e) => {
if(!isImageLoaded) return;
const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
const mouseX = (e.clientX - rect.left) * scaleX; const mouseY = (e.clientY - rect.top) * scaleY;
if(isHittingText(mouseX, mouseY)) { isDragging = true; dragOffsetX = mouseX - textX; dragOffsetY = mouseY - textY; canvas.style.cursor = 'grabbing'; }
});
window.addEventListener('mousemove', (e) => {
if(!isImageLoaded) return;
const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
const mouseX = (e.clientX - rect.left) * scaleX; const mouseY = (e.clientY - rect.top) * scaleY;
if(!isDragging) { canvas.style.cursor = isHittingText(mouseX, mouseY) ? 'grab' : 'default'; }
if (isDragging) { textX = mouseX - dragOffsetX; textY = mouseY - dragOffsetY; draw(); }
});
downloadBtn.addEventListener('click', () => {
if (!isImageLoaded) { alert('Vui lòng thêm ảnh trước khi lưu nhé!'); return; }
const link = document.createElement('a'); link.download = 'anh-tho-tien-hiep.png'; link.href = canvas.toDataURL('image/png'); link.click();
});
document.fonts.ready.then(function () { if(isImageLoaded) draw(); });
</script>
</body>
</html>
